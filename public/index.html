<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English · العربية</title>
    <!--
      The root layout lives at app/[lang]/layout.tsx, so Next does not generate a
      page for "/". On Vercel, vercel.json redirects "/" before this file is
      reached; on any other static host this sends visitors to English and
      offers Arabic. Keep the links in step with lib/i18n.ts.
    -->
    <link rel="canonical" href="https://services.nourin.is-a.dev/en/" />
    <link rel="alternate" hreflang="en" href="https://services.nourin.is-a.dev/en/" />
    <link rel="alternate" hreflang="ar" href="https://services.nourin.is-a.dev/ar/" />
    <link rel="alternate" hreflang="x-default" href="https://services.nourin.is-a.dev/en/" />
    <meta http-equiv="refresh" content="0; url=/en/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        background: #f2f0ea;
        color: #1a1b19;
        font: 16px/1.5 system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <p><a href="/en/">Continue in English</a></p>
    <p><a href="/ar/" lang="ar" dir="rtl">المتابعة بالعربية</a></p>
  </body>
</html>
